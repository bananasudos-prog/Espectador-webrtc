<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Espectador Dragon Ball</title><style>*{box-sizing:border-box}body{margin:0;background:#080810;color:#fff;font:15px system-ui;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:14px;gap:10px}h2{margin:4px}p{margin:0;color:#d1d5db;text-align:center}input,button{font:inherit;border-radius:9px;padding:11px;border:1px solid #6d28d9}input{background:#171722;color:white;width:180px}button{background:#6d28d9;color:white;font-weight:800}#status{color:#c4b5fd;text-align:center;overflow-wrap:anywhere}video{width:100%;max-width:900px;max-height:75vh;background:#000;border:1px solid #6d28d9;border-radius:10px;object-fit:contain}small{color:#a1a1aa;text-align:center;max-width:650px}</style></head><body><h2>🐉 Modo Espectador</h2><p>Digite o código que aparece no celular do jogador.</p><div><input id="code" inputmode="numeric" maxlength="8" placeholder="Código da sala"><button id="connect" type="button" onclick="window.connectSpectator()">CONECTAR</button></div><div id="status">Aguardando código.</div><video id="video" autoplay playsinline controls></video><small>Teste inicial da transmissão da página. Se não conectar, pode ser necessário ajustar as regras do Firebase. A captura reduzida pode ficar menos fluida em celulares mais fracos.</small><script>
// Fallback fora do módulo: se os imports falharem, o botão ainda explica o problema.
window.connectSpectator = function () {
  const status = document.getElementById('status');
  const code = document.getElementById('code').value.trim();
  if (!/^\d{8}$/.test(code)) {
    status.textContent = 'Digite o código de 8 números.';
    return;
  }
  status.textContent = 'O botão funciona, mas o módulo do Firebase não carregou. Recarregue o site e confira a conexão.';
};

window.connectSpectator=async()=>{clear();const code=$('code').value.trim();if(!/^\d{8}$/.test(code)){msg('Digite o código de 8 números.');return} $('connect').disabled=true;msg('1/4: Botão acionado. Iniciando Firebase…');try{const app=getApps().length?getApp():initializeApp(cfg);const auth=getAuth(app);if(!auth.currentUser){msg('2/4: Entrando anonimamente no Firebase… (aguarde até 12 s)');await Promise.race([signInAnonymously(auth),new Promise((_,reject)=>setTimeout(()=>reject(new Error('TEMPO ESGOTADO na autenticação anônima após 12 segundos. O Firebase Auth não respondeu.')),12000))])}msg('3/4: Buscando a sala '+code+'…');const db=getDatabase(app),rr=ref(db,'webrtcRooms/'+code),snap=await get(rr);if(!snap.exists()||!snap.val().offer){msg('Sala não encontrada. Confirme o código e tente novamente.');return}msg('4/4: Sala encontrada. Negociando vídeo…');pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});pc.ontrack=e=>{$('video').srcObject=e.streams[0];msg('Vídeo recebido! Estado: '+pc.connectionState)};pc.onconnectionstatechange=()=>{if(pc)msg('Conexão: '+pc.connectionState)};let pending=[];const stopRemote=onChildAdded(ref(db,'webrtcRooms/'+code+'/senderCandidates'),async s=>{const c=s.val();if(!c)return;try{if(pc.remoteDescription)await pc.addIceCandidate(new RTCIceCandidate(c));else pending.push(c)}catch(e){console.warn(e)}});offs.push(stopRemote);pc.onicecandidate=async e=>{if(e.candidate)await push(ref(db,'webrtcRooms/'+code+'/viewerCandidates'),e.candidate.toJSON())};await pc.setRemoteDescription(new RTCSessionDescription(snap.val().offer));for(const c of pending)await pc.addIceCandidate(new RTCIceCandidate(c));pending=[];const ans=await pc.createAnswer();await pc.setLocalDescription(ans);await set(ref(db,'webrtcRooms/'+code+'/answer'),{type:ans.type,sdp:ans.sdp});msg('Oferta recebida; negociando vídeo…');}catch(e){msg('FALHA ['+(e.code||e.name||'erro')+']: '+(e.message||String(e)));console.error('Erro completo do Espectador:',e)}fi
